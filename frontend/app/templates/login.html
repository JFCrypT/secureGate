{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<section class="card login">
  <h1>Ingresar</h1>
  {% if error %}<p class="banner banner-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ base }}/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" name="usuario" value="{{ usuario | default('') }}"
             autocomplete="username" autocapitalize="none" required autofocus>
    </div>
    <div class="field">
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" name="clave" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary">Ingresar</button>
  </form>
</section>
{% endblock %}
